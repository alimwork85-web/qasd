<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Qasd (قصد) - whole-disk file search for Windows, by Ali Alhumedi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#112a4d"/>
    </linearGradient>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M200 0V400M400 0V400M600 0V400M800 0V400M1000 0V400"/>
  </g>
  <!-- the app icon: a bold Q on the blue tile -->
  <g transform="translate(100 100) scale(1.0000)">
    <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#tile)"/>
    <circle cx="96" cy="94" r="43" fill="none" stroke="#ffffff" stroke-width="20"/>
    <path d="M114 114 L154 154" stroke="url(#tile)" stroke-width="42" stroke-linecap="round"/>
    <path d="M114 114 L154 154" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  </g>
  <g font-family="Segoe UI Variable Display, Segoe UI, Tahoma, Arial, sans-serif" fill="#ffffff">
    <text x="360" y="150" font-size="84" font-weight="700">Qasd <tspan fill="#4fb3f6">قصد</tspan></text>
    <text x="362" y="200" font-size="28" fill="#c9d8ee">Whole-disk file search for Windows, in Rust</text>
    <text x="362" y="240" font-size="24" fill="#c9d8ee">بحث فائق السرعة في كل ملفات ويندوز</text>
    <g font-size="20" font-weight="600">
      <rect x="362" y="276" width="166" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#4fb3f6" stroke-opacity="0.55"/>
      <text x="445" y="303" text-anchor="middle" fill="#e6eefa">Alt+Q window</text>
      <rect x="540" y="276" width="190" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#4fb3f6" stroke-opacity="0.55"/>
      <text x="635" y="303" text-anchor="middle" fill="#e6eefa">0.8 ms per search</text>
      <rect x="742" y="276" width="196" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#4fb3f6" stroke-opacity="0.55"/>
      <text x="840" y="303" text-anchor="middle" fill="#e6eefa">2M files in 5.3 s</text>
      <rect x="950" y="276" width="160" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#4fb3f6" stroke-opacity="0.55"/>
      <text x="1030" y="303" text-anchor="middle" fill="#e6eefa">Arabic-aware</text>
    </g>
    <text x="362" y="360" font-size="18" fill="#8fa6c6">by Ali Alhumedi  ·  MIT  ·  github.com/alimwork85-web/qasd</text>
  </g>
</svg>
