<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="Time to index C: (2.1 million entries): folder crawl cold 34 s, folder crawl warm 9.5 s, MFT as administrator 5.3 s, restart with the change journal 0.08 s">
