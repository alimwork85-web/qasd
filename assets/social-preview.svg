<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#112a4d"/>
    </linearGradient>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280M160 0V640M320 0V640M480 0V640M640 0V640M800 0V640M960 0V640M1120 0V640"/>
  </g>
  <!-- the app icon: a bold Q on the blue tile -->
  <g transform="translate(110 110) scale(1.2500)">
    <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#tile)"/>
    <circle cx="96" cy="94" r="43" fill="none" stroke="#ffffff" stroke-width="20"/>
    <path d="M114 114 L154 154" stroke="url(#tile)" stroke-width="42" stroke-linecap="round"/>
    <path d="M114 114 L154 154" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  </g>
  <g font-family="Segoe UI Variable Display, Segoe UI, Tahoma, Arial, sans-serif" fill="#ffffff">
    <text x="440" y="215" font-size="110" font-weight="700">Qasd <tspan fill="#4fb3f6">قصد</tspan></text>
    <text x="444" y="275" font-size="32" fill="#c9d8ee">Whole-disk file search for Windows, in Rust</text>
    <text x="444" y="325" font-size="30" fill="#c9d8ee">بحث فائق السرعة في كل ملفات ويندوز</text>
    <g font-size="24" font-weight="600">
      <rect x="120" y="420" width="230" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#4fb3f6" stroke-opacity="0.55"/>
      <text x="235" y="457" text-anchor="middle" fill="#e6eefa">Alt+Q window</text>
      <rect x="362" y="420" width="250" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#4fb3f6" stroke-opacity="0.55"/>
      <text x="487" y="457" text-anchor="middle" fill="#e6eefa">0.8 ms per search</text>
      <rect x="624" y="420" width="262" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#4fb3f6" stroke-opacity="0.55"/>
      <text x="755" y="457" text-anchor="middle" fill="#e6eefa">2M files in 5.3 s</text>
      <rect x="898" y="420" width="210" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#4fb3f6" stroke-opacity="0.55"/>
      <text x="1003" y="457" text-anchor="middle" fill="#e6eefa">Arabic-aware</text>
    </g>
    <text x="640" y="545" font-size="24" fill="#8fa6c6" text-anchor="middle">by Ali Alhumedi  ·  MIT  ·  github.com/alimwork85-web/qasd</text>
  </g>
</svg>
