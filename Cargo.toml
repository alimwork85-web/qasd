[package]
name = "qasd"
version = "0.7.1"
authors = ["Ali Alhumedi"]
edition = "2024"
license = "MIT"
description = "Qasd: whole-disk file search for Windows by Ali Alhumedi - fuzzy names, typo tolerance, indexed content grep, disk usage (a Windows port of fsearch)"
repository = "https://github.com/alimwork85-web/qasd"

[dependencies]
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
unicode-normalization = "0.1"

# COM (the shell's context menu) for the search window.
[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
]

[build-dependencies]
embed-resource = "3"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_System_Console",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_UI_Shell",
  "Win32_System_Memory",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Time",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = false
