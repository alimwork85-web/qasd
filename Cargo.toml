[package]
name = "qasd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Whole-disk file search for Windows: fuzzy names, typo tolerance, indexed content grep (a Windows port of fsearch)"

[dependencies]
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
unicode-normalization = "0.1"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_System_Console",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_UI_Shell",
  "Win32_System_Memory",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = false
